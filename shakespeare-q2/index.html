<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Globe Lernplattform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#EDEFEA; --surface:#F8F9F5; --surface-2:#E3E7E0; --ink:#1C2320; --muted:#56625C; --line:#CDD4CC;
  --accent:#1F5E4B; --accent-soft:#D5E6DD; --accent-ink:#FFFFFF;
  --gold:#8A6212; --gold-soft:#F1E6C8;
  --good:#2C6B39; --good-soft:#D9EBD9; --bad:#9B2C2C; --bad-soft:#F3DADA;
  --display:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#111513; --surface:#18201C; --surface-2:#212B26; --ink:#E5E9E2; --muted:#98A59E; --line:#2D3833;
    --accent:#72C2A3; --accent-soft:#1E3A30; --accent-ink:#0C1511;
    --gold:#D9B35C; --gold-soft:#3A3120;
    --good:#7FCB8C; --good-soft:#1E3524; --bad:#E58076; --bad-soft:#3E2220;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111513; --surface:#18201C; --surface-2:#212B26; --ink:#E5E9E2; --muted:#98A59E; --line:#2D3833;
  --accent:#72C2A3; --accent-soft:#1E3A30; --accent-ink:#0C1511;
  --gold:#D9B35C; --gold-soft:#3A3120;
  --good:#7FCB8C; --good-soft:#1E3524; --bad:#E58076; --bad-soft:#3E2220;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,6vw,3.6rem)}
h2{font-size:clamp(1.7rem,4vw,2.3rem)}
h3{font-size:1.4rem}
h4{font-size:1.15rem}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.en{font-style:italic}

/* Layout */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:20px;background:var(--surface)}
.brand{display:flex;flex-direction:column;gap:2px;padding-inline:8px}
.brand b{font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1}
.brand span{font-size:.85rem;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav a .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:none}
.nav a.seen .dot{background:var(--gold)}
.nav a[aria-current="page"] .dot{background:var(--accent-ink)}
.side-foot{margin-top:auto;font-size:.85rem;color:var(--muted);padding-inline:8px;display:flex;flex-direction:column;gap:6px}
.meter{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
.shell > div{min-width:0}
main{padding-inline:clamp(16px,4vw,56px);padding-block:32px 80px;min-width:0}
.page{max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:32px}
.page-head{display:flex;flex-direction:column;gap:10px;max-width:68ch}
.lead{font-size:1.12rem;color:var(--muted)}
.topbar{display:none}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;flex-direction:column;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar .brand{padding:0;flex-direction:row;align-items:baseline;gap:10px}
  .topbar .brand b{font-size:1.3rem}
  .chips-nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips-nav::-webkit-scrollbar{display:none}
  .chips-nav a{flex:none;padding:6px 12px;border-radius:99px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:.92rem;font-weight:500}
  .chips-nav a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  main{padding-block:24px 64px}
}

/* Blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.section{display:flex;flex-direction:column;gap:16px}
.section > h2{padding-bottom:6px;border-bottom:1px solid var(--line)}
ul.clean{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
ul.bul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:.95rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.term{font-weight:700}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.8rem;font-weight:500;background:var(--surface-2);color:var(--ink)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.green{background:var(--accent-soft);color:var(--accent)}
.quote{font-family:var(--display);font-size:1.2rem;line-height:1.35}
.quote-src{font-size:.85rem;color:var(--muted)}
blockquote{margin:0;padding-left:14px;border-left:2px solid var(--gold)}
.tip{background:var(--gold-soft);border-radius:var(--r);padding:14px 16px;font-size:.97rem}
.tip b{color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 11px;font-size:.9rem}
.chip{padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:.93rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type="search"],select{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:0}

/* Start */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end;padding-bottom:24px;border-bottom:1px solid var(--line)}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero-quote{font-family:var(--display);font-size:1.25rem;line-height:1.4;color:var(--muted)}
.hero-quote i{display:block;font-size:.9rem;font-family:var(--body);font-style:normal;margin-top:6px}
@media (max-width:700px){.hero{grid-template-columns:1fr}}
.path{counter-reset:step;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.path a{counter-increment:step;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink)}
.path a::before{content:"Schritt " counter(step);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700}
.path a:hover{border-color:var(--accent)}
.path a b{font-family:var(--display);font-weight:400;font-size:1.25rem}
.path a span{font-size:.92rem;color:var(--muted)}
.path a.seen b::after{content:" ✓";color:var(--good);font-family:var(--body);font-size:1rem}
.stats{display:flex;flex-wrap:wrap;gap:28px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:2rem;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:.85rem;color:var(--muted)}

/* Freytag */
.freytag svg{width:100%;height:auto;display:block}
.freytag .node{cursor:pointer}
.freytag .node circle{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.freytag .node.on circle{fill:var(--accent)}
.freytag .node text{fill:var(--ink);font-family:var(--body);font-size:13px;font-weight:700}
.freytag .node .roman{fill:var(--accent);font-family:var(--display);font-size:15px;font-weight:400}
.freytag .node.on .roman{fill:var(--accent-ink)}
.freytag path.curve{fill:none;stroke:var(--ink);stroke-width:2}
.freytag .area{fill:var(--accent-soft)}
.freytag .axis{stroke:var(--line);stroke-width:1}

/* Scansion */
.scan-line{display:flex;flex-wrap:wrap;gap:4px;font-family:var(--mono);font-size:1rem}
.syl{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:34px;padding:6px 6px 4px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.syl .mk{font-size:1rem;line-height:1;height:1rem;color:var(--muted)}
.syl[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.syl[aria-pressed="true"] .mk{color:var(--accent);font-weight:600}
.syl.right{border-color:var(--good);background:var(--good-soft)}
.syl.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{padding:12px 14px;border-radius:8px;font-size:.96rem}
.feedback.ok{background:var(--good-soft);color:var(--good)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.feedback.info{background:var(--surface-2)}
.mono{font-family:var(--mono);font-size:.92rem}

/* Sonnet */
.sonnet{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;font-family:var(--display);font-size:1.1rem;line-height:1.5}
.sonnet .ln{font-family:var(--mono);font-size:.75rem;color:var(--muted);align-self:center;font-variant-numeric:tabular-nums}
.sonnet .rh{font-family:var(--mono);font-size:.85rem;font-weight:600;align-self:center;padding:0 7px;border-radius:4px}
.sonnet .gap{grid-column:1/-1;height:8px}
.sonnet .couplet{padding-left:1.5em}
.volta{color:var(--bad);font-weight:700}
.rA{background:#D5E6DD;color:#1F5E4B}.rB{background:#F1E6C8;color:#7A560E}.rC{background:#DCE3F2;color:#2D4677}.rD{background:#EEDCE6;color:#7A2E57}
.rE{background:#E4E0F2;color:#4A3C82}.rF{background:#DDEDEF;color:#1F6068}.rG{background:#F3DADA;color:#9B2C2C}
:root[data-theme="dark"] .sonnet .rh{filter:saturate(.9) brightness(.9)}

/* Glossary */
.gloss{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.gcard h4{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.gcard .ex{font-family:var(--display);font-size:1.02rem;line-height:1.35}
.gcard .fn{font-size:.92rem}
.gcard .fn b{color:var(--accent)}

/* Plays */
.play-head{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end}
.acts{display:flex;flex-direction:column}
.act{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act .no{font-family:var(--display);font-size:1.5rem;color:var(--accent);line-height:1}
.act .no small{display:block;font-family:var(--body);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.act.turn .no{color:var(--gold)}

/* Schemas */
.steps{counter-reset:s;display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.steps > li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.steps > li:last-child{border-bottom:0}
.steps > li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.steps h4{margin-bottom:4px}
.phrases{font-size:.93rem;color:var(--muted);font-style:italic}
.peel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.peel div{border-top:3px solid var(--accent);background:var(--surface);padding:12px 14px;border-radius:0 0 8px 8px}
.peel b{font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--accent)}
.sample{font-size:1rem;line-height:1.65}
.sample mark{background:transparent;border-bottom:2px solid;padding-bottom:1px}
.sample .mP{border-color:var(--accent)} .sample .mE{border-color:var(--gold)} .sample .mX{border-color:#5C7BC0} .sample .mL{border-color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem}
.legend span::before{content:"";display:inline-block;width:14px;height:3px;margin-right:6px;vertical-align:middle;background:currentColor}
.subtabs{display:flex;flex-wrap:wrap;gap:6px}

/* Flashcards */
.fc-wrap{display:flex;flex-direction:column;gap:14px;align-items:stretch;max-width:640px}
.fc{perspective:1200px;height:300px;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:24px;display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:auto}
.fc-face.back{transform:rotateY(180deg);background:var(--surface-2)}
.fc-face .big{font-family:var(--display);font-size:2.1rem;line-height:1.1}
.fc-hint{position:absolute;bottom:12px;right:16px;font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.fc-inner{transition:none}.meter i{transition:none}}

/* Quiz */
.q-opts{display:flex;flex-direction:column;gap:8px}
.q-opt{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.q-opt:hover:not(:disabled){border-color:var(--accent)}
.q-opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.q-opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.q-opt:disabled{cursor:default}
.q-prog{display:flex;gap:4px}
.q-prog i{flex:1;height:5px;border-radius:99px;background:var(--surface-2)}
.q-prog i.ok{background:var(--good)} .q-prog i.no{background:var(--bad)} .q-prog i.cur{background:var(--accent)}

/* Checklist */
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.timeline{display:flex;height:34px;border-radius:8px;overflow:hidden;font-size:.8rem;font-weight:700}
.timeline div{display:flex;align-items:center;justify-content:center;color:var(--accent-ink);white-space:nowrap;overflow:hidden;padding:0 4px}
.foot{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Navigation">
    <div class="brand"><b>The Globe</b><span>Shakespeare · Englisch Q2</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <span id="prog-label">Fortschritt</span>
      <div class="meter"><i id="prog-bar"></i></div>
    </div>
  </aside>
  <div>
    <header class="topbar">
      <div class="brand"><b>The Globe</b><span>Shakespeare · Q2</span></div>
      <nav class="chips-nav" id="chips"></nav>
    </header>
    <main id="main"></main>
  </div>
</div>

<script>
/* ============ Storage (optional, fails silently) ============ */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("globe:"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("globe:"+k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ============ DATA ============ */
const SECTIONS = [
  {id:"start", name:"Start"},
  {id:"kontext", name:"Kontext & Globe"},
  {id:"drama", name:"Dramenstruktur"},
  {id:"sprache", name:"Vers & Sprache"},
  {id:"stilmittel", name:"Stilmittel"},
  {id:"werke", name:"Die Stücke"},
  {id:"schemas", name:"Analyse-Schemas"},
  {id:"film", name:"Filmanalyse"},
  {id:"karten", name:"Karteikarten"},
  {id:"quiz", name:"Quiz"},
  {id:"klausur", name:"Klausur-Check"}
];

const DEVICES = [
  {t:"Metaphor", de:"Metapher", cat:"Bildsprache", def:"Direkter Vergleich ohne „like/as“: etwas wird mit etwas anderem gleichgesetzt.", ex:"“It is the east, and Juliet is the sun.”", src:"Romeo and Juliet 2.2", fn:"Idealisiert Juliet als Lichtquelle und Lebensmittelpunkt; zeigt Romeos schwärmerische Liebe."},
  {t:"Simile", de:"Vergleich", cat:"Bildsprache", def:"Vergleich mit „like“ oder „as“.", ex:"“My bounty is as boundless as the sea, / My love as deep.”", src:"Romeo and Juliet 2.2", fn:"Veranschaulicht die grenzenlose Tiefe von Juliets Liebe."},
  {t:"Personification", de:"Personifikation", cat:"Bildsprache", def:"Dinge oder Abstraktes bekommen menschliche Eigenschaften.", ex:"“Arise, fair sun, and kill the envious moon.”", src:"Romeo and Juliet 2.2", fn:"Der Mond wird neidisch, die Sonne (Juliet) aktiv – Juliet überstrahlt alles."},
  {t:"Imagery", de:"Bildlichkeit / Bildfelder", cat:"Bildsprache", def:"Wiederkehrende bildhafte Sprache aus einem Bereich (z. B. Licht/Dunkel, Blut, Krankheit).", ex:"“Will all great Neptune's ocean wash this blood / Clean from my hand?”", src:"Macbeth 2.2", fn:"Blut-Bildfeld zieht sich durch das Stück und steht für Schuld, die nicht abwaschbar ist."},
  {t:"Symbol", de:"Symbol", cat:"Bildsprache", def:"Konkreter Gegenstand steht für eine abstrakte Idee.", ex:"Desdemonas Taschentuch (handkerchief)", src:"Othello 3.3", fn:"Steht für Treue und Liebe – und wird von Iago zum „Beweis“ der Untreue umgedeutet."},
  {t:"Oxymoron", de:"Oxymoron", cat:"Gegensatz", def:"Zwei sich widersprechende Begriffe direkt verbunden.", ex:"“O brawling love! O loving hate!” / “Parting is such sweet sorrow.”", src:"Romeo and Juliet 1.1 / 2.2", fn:"Drückt Romeos innere Zerrissenheit und die widersprüchliche Natur der Liebe aus."},
  {t:"Antithesis", de:"Antithese", cat:"Gegensatz", def:"Gegensätzliche Gedanken werden in parallel gebauten Satzteilen gegenübergestellt.", ex:"“Not that I loved Caesar less, but that I loved Rome more.”", src:"Julius Caesar 3.2", fn:"Brutus rechtfertigt den Mord scheinbar logisch und ausgewogen."},
  {t:"Paradox", de:"Paradoxon", cat:"Gegensatz", def:"Scheinbar widersprüchliche Aussage, die auf tieferer Ebene Sinn ergibt.", ex:"“I must be cruel only to be kind.”", src:"Hamlet 3.4", fn:"Hamlet rechtfertigt seine Härte gegenüber Gertrude als eigentlich fürsorglich."},

function markSeen(id){
  state.seen.add(id); store.set("seen", [...state.seen]);
  const pct = Math.round(state.seen.size / SECTIONS.length * 100);
  document.getElementById("prog-bar").style.width = pct + "%";
  document.getElementById("prog-label").textContent = `Fortschritt: ${state.seen.size} von ${SECTIONS.length} Kapiteln`;
}

/* ============ Navigation ============ */
function renderNav(cur){
  const html = SECTIONS.map(s => `<a href="#${s.id}" class="${state.seen.has(s.id)?"seen":""}" ${s.id===cur?'aria-current="page"':""}><span>${s.name}</span><i class="dot"></i></a>`).join("");
  document.getElementById("nav").innerHTML = html;
  document.getElementById("chips").innerHTML = SECTIONS.map(s => `<a href="#${s.id}" ${s.id===cur?'aria-current="page"':""}>${s.name}</a>`).join("");
  const active = document.querySelector('#chips a[aria-current="page"]');
  if(active) active.scrollIntoView({block:"nearest", inline:"center"});
}

function route(){
  const id = (location.hash || "#start").slice(1);
  const sec = SECTIONS.find(s => s.id === id) ? id : "start";
  markSeen(sec);
  renderNav(sec);
  const main = document.getElementById("main");
  main.innerHTML = `<div class="page">${VIEWS[sec]()}</div>`;
  if(AFTER[sec]) AFTER[sec]();
  window.scrollTo(0,0);
}

        <path class="area" d="M30 230 L140 205 L330 55 L510 175 L630 230 Z"/>

    <div class="table-wrap"><table><thead><tr><th>Akt</th><th>Phase</th><th>Funktion</th></tr></thead><tbody>
      <tr><td class="mono">I</td><td><b>Exposition</b></td><td>Einführung von Figuren, Ort, Zeit, Vorgeschichte und Grundkonflikt; ein erregendes Moment (inciting incident) setzt die Handlung in Gang.</td></tr>
      <tr><td class="mono">II</td><td><b>Rising action / complication</b></td><td>Der Konflikt verschärft sich, Spannung steigt, Intrigen entstehen.</td></tr>
      <tr><td class="mono">III</td><td><b>Climax / turning point</b></td><td>Höhepunkt und Wendepunkt (peripeteia): Das Schicksal des Helden kippt.</td></tr>
      <tr><td class="mono">IV</td><td><b>Falling action</b></td><td>Folgen des Wendepunkts; ein <b>retarding moment</b> (Verzögerung) lässt noch einmal auf Rettung hoffen.</td></tr>
      <tr><td class="mono">V</td><td><b>Catastrophe / denouement</b></td><td>Tragödie: Untergang und Tod, Ordnung wird wiederhergestellt. Komödie: Auflösung (resolution), Hochzeit.</td></tr>

        <li>Verwechslung, Verkleidung (oft Frauen als Männer)</li>
        <li>Ortswechsel in eine „grüne Welt“ (Wald, Land)</li>

AFTER.drama = () => {
  const info = document.getElementById("frey-info");
  const phases = ["Exposition","Rising action","Climax / turning point","Falling action","Catastrophe / resolution"];
  const draw = () => {
    const p = PLAYS.find(x=>x.id===state.freyPlay);
    document.querySelectorAll("#frey-svg .node").forEach(n=>n.classList.toggle("on", +n.dataset.act===state.freyAct));
    const turn = p.turn===state.freyAct ? ` <span class="tag gold">Wendepunkt</span>` : "";
    info.innerHTML = `<div class="row"><span class="eyebrow">Akt ${state.freyAct} · ${phases[state.freyAct-1]}</span>${turn}</div><p><b class="en">${p.title}:</b> ${p.acts[state.freyAct-1]}</p>`;
  };
  document.querySelectorAll("#frey-svg .node").forEach(n=>{
    const go = () => { state.freyAct = +n.dataset.act; draw(); };
    n.addEventListener("click", go);
    n.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
  });
  document.getElementById("frey-play").addEventListener("change", e=>{ state.freyPlay = e.target.value; draw(); });
  draw();
};

VIEWS.sprache = () => `
  <header class="page-head"><span class="eyebrow">Kapitel 3</span><h1>Vers & Sprache</h1><p class="lead">Die Form verrät viel: Wer spricht in Vers, wer in Prosa, wann wird gereimt, wann bricht der Rhythmus? Genau das macht eine gute Analyse aus.</p></header>
  <section class="section"><h2>Die drei Sprachformen</h2>
    <div class="table-wrap"><table><thead><tr><th>Form</th><th>Merkmale</th><th>Wer / wann</th><th>Beispiel</th></tr></thead><tbody>
      <tr><td><b>Blank verse</b></td><td>ungereimter iambischer Pentameter</td><td>Adlige, ernste Themen, wichtige Gedanken, Soliloquies</td><td class="en">“To be, or not to be, that is the question”</td></tr>
      <tr><td><b>Prose</b></td><td>kein Metrum, kein Reim</td><td>Diener, einfache Leute, Komik, Briefe, Wahnsinn, private Gespräche</td><td class="en">Lady Macbeth: “Out, damned spot! Out, I say!”</td></tr>
      <tr><td><b>Rhymed verse</b></td><td>Reimpaare (heroic couplets), Sonettform</td><td>Szenenende, Liebende, Übernatürliches, Prologe, Sentenzen</td><td class="en">“The play's the thing / Wherein I'll catch the conscience of the king.”</td></tr>
    </tbody></table></div>
    <div class="tip"><b>Wichtig für die Analyse:</b> Ein Wechsel der Form ist immer bedeutsam. Wechselt eine adlige Figur in Prosa, zeigt das oft Kontrollverlust, Wahnsinn oder Herablassung. Sprechen zwei Figuren plötzlich in Reimen oder teilen sich Verszeilen (shared lines), zeigt das Harmonie und Nähe.</div>
  </section>
  <section class="section"><h2>Metrum: Versfüße</h2>
    <div class="table-wrap"><table><thead><tr><th>Versfuß</th><th>Muster</th><th>Beispielwort</th><th>Wirkung</th></tr></thead><tbody>
      <tr><td><b>Iamb</b> (Iambus)</td><td class="mono">˘ ´ · da-DUM</td><td class="en">be-FORE, a-LONE</td><td>natürlich, wie Herzschlag, Sprechrhythmus</td></tr>
      <tr><td><b>Trochee</b> (Trochäus)</td><td class="mono">´ ˘ · DUM-da</td><td class="en">DOU-ble, TROU-ble</td><td>fallend, beschwörend (Hexen), energisch</td></tr>
      <tr><td><b>Spondee</b> (Spondeus)</td><td class="mono">´ ´ · DUM-DUM</td><td class="en">“Out, out”</td><td>Nachdruck, Schwere, Verlangsamung</td></tr>
      <tr><td><b>Anapaest</b></td><td class="mono">˘ ˘ ´ · da-da-DUM</td><td class="en">in-ter-VENE</td><td>schnell, galoppierend</td></tr>
      <tr><td><b>Dactyl</b> (Daktylus)</td><td class="mono">´ ˘ ˘ · DUM-da-da</td><td class="en">MER-ri-ly</td><td>tänzerisch, fallend</td></tr>
    </tbody></table></div>
    <p>Anzahl der Füße pro Vers: <b>trimeter</b> (3), <b>tetrameter</b> (4), <b>pentameter</b> (5), <b>hexameter</b> (6). Also: <i>iambic pentameter</i> = fünf Iamben = zehn Silben.</p>
    <div class="grid g3">
      <div class="panel stack"><h4>Feminine ending</h4><p>Unbetonte Zusatzsilbe am Versende (11 Silben). Wirkt offen, zweifelnd, unruhig.</p></div>
      <div class="panel stack"><h4>Trochaic inversion</h4><p>Ein Trochäus ersetzt einen Iambus, oft am Versanfang. Betont das erste Wort.</p></div>
      <div class="panel stack"><h4>Caesura</h4><p>Sprechpause mitten im Vers (Satzzeichen). Zeigt Zögern, Nachdenken, Bruch.</p></div>
      <div class="panel stack"><h4>Enjambment</h4><p>Der Satz läuft über das Versende hinaus. Wirkt fließend, drängend oder emotional.</p></div>
      <div class="panel stack"><h4>Shared line</h4><p>Ein Vers auf zwei Sprecher verteilt. Zeigt Tempo, Einigkeit oder Konflikt.</p></div>
      <div class="panel stack"><h4>Irregular metre</h4><p>Unregelmäßiger Rhythmus spiegelt innere Unruhe der Figur.</p></div>
    </div>
  </section>
  <section class="section"><h2>Metrum-Trainer</h2>
    <p class="muted">Tippe die Silben an, die du betont liest. Dann prüfen. Tipp: Lies laut und übertrieben.</p>
    <div class="panel stack" id="scan"></div>
  </section>
  <section class="section"><h2>Das Shakespeare-Sonett: Sonnet 18</h2>
    <div class="grid g2">
      <div class="panel"><div class="sonnet">${SONNET18.map((l,i)=>`${i===4||i===8||i===12?'<div class="gap"></div>':""}<span class="ln">${i+1}</span><span class="${i>=12?"couplet":""}">${i===8?'<span class="volta">But</span>'+esc(l[0].slice(3)):esc(l[0])}</span><span class="rh r${l[1]}">${l[1]}</span>`).join("")}</div></div>
      <div class="stack">
        <dl class="kv">
          <dt>Form</dt><dd>14 Verse: 3 Quartette + 1 Couplet</dd>
          <dt>Reimschema</dt><dd class="mono">ABAB CDCD EFEF GG</dd>
          <dt>Metrum</dt><dd>iambischer Pentameter</dd>
          <dt>Volta</dt><dd>Vers 9, „But“: vom vergänglichen Sommer zur ewigen Schönheit</dd>
          <dt>Thema</dt><dd>Vergänglichkeit der Schönheit; Dichtung macht unsterblich</dd>
        </dl>
        <ul class="bul">
          <li><b>Q1:</b> Vergleich mit einem Sommertag – der Geliebte ist schöner und ausgeglichener; der Sommer ist zu kurz.</li>
          <li><b>Q2:</b> Die Sonne („the eye of heaven“, Personifikation) ist zu heiß oder verdeckt; alle Schönheit vergeht.</li>
          <li><b>Q3:</b> Wendung: Der „ewige Sommer“ des Geliebten vergeht nicht, nicht einmal der Tod kann prahlen.</li>
          <li><b>Couplet:</b> Solange Menschen lesen, lebt das Gedicht – und mit ihm der Geliebte.</li>
        </ul>
        <div class="tip"><b>Vergleich:</b> Das italienische (Petrarca-)Sonett hat Oktett + Sextett (ABBAABBA CDECDE), Volta nach Vers 8. Shakespeares <span class="en">Sonnet 130</span> („My mistress' eyes are nothing like the sun“) parodiert diese idealisierende Tradition.</div>
      </div>
    </div>
    <p class="muted">Auch <span class="en">Romeo and Juliet</span> enthält Sonette: der Prolog und das erste Gespräch der Liebenden (1.5), ein geteiltes Sonett, das mit einem Kuss endet.</p>
  </section>
  <section class="section"><h2>Early Modern English</h2>
    <div class="grid g2">
      <div class="table-wrap"><table><thead><tr><th>Shakespeare</th><th>Heute</th></tr></thead><tbody>
        <tr><td class="en">thou / thee / thy / thine</td><td>you (Subj.) / you (Obj.) / your / yours</td></tr>
        <tr><td class="en">art, hast, dost, wilt</td><td>are, have, do, will (bei thou)</td></tr>
        <tr><td class="en">hath, doth, -eth (loveth)</td><td>has, does, -s (loves)</td></tr>
        <tr><td class="en">wherefore</td><td>why</td></tr>
        <tr><td class="en">ere · anon · hence · whither</td><td>before · soon · from here · where to</td></tr>
        <tr><td class="en">'tis · 'twas · o'er · e'en</td><td>it is · it was · over · even</td></tr>
        <tr><td class="en">prithee · marry · alas</td><td>please · indeed · unfortunately</td></tr>
      </tbody></table></div>
      <div class="panel stack"><h3>Thou oder you?</h3>
        <p><b class="en">thou</b>: vertraut, zärtlich (Liebende, Freunde), zu Untergebenen, oder beleidigend.</p>
        <p><b class="en">you</b>: höflich, respektvoll, distanziert; Kinder zu Eltern, Untergebene zu Höhergestellten.</p>
        <div class="tip"><b>Analyse-Gold:</b> Wechselt eine Figur von <i>you</i> zu <i>thou</i> (oder umgekehrt), ändert sich die Beziehung: plötzliche Nähe, Wut oder Verachtung. Das ist ein starkes Argument in jeder Szenenanalyse.</div>
      </div>
    </div>
  </section>`;

AFTER.sprache = () => {
  const box = document.getElementById("scan");
  let marks = [];
  const draw = () => {
    const s = SCANSION[state.scanIdx];
    marks = s.syl.map(()=>0);
    box.innerHTML = `
      <div class="row" style="justify-content:space-between"><span class="eyebrow">Vers ${state.scanIdx+1} von ${SCANSION.length} · ${esc(s.src)}</span>
        <div class="row"><button class="btn small" id="scan-prev" aria-label="Vorheriger Vers">←</button><button class="btn small" id="scan-next" aria-label="Nächster Vers">→</button></div></div>
      <p class="quote">${esc(s.line)}</p>
      <div class="scan-line" id="scan-syl">${s.syl.map((x,i)=>`<button class="syl" data-i="${i}" aria-pressed="false"><span class="mk">˘</span><span>${esc(x)}</span></button>`).join("")}</div>
      <div class="row"><label for="scan-meter" class="muted">Metrum:</label>
        <select id="scan-meter"><option value="">bitte wählen</option>${[...new Set(SCANSION.map(x=>x.meter))].map(m=>`<option>${m}</option>`).join("")}</select>
        <button class="btn primary" id="scan-check">Prüfen</button><button class="btn" id="scan-show">Lösung zeigen</button></div>
      <div id="scan-fb"></div>`;
    box.querySelectorAll(".syl").forEach(b=>b.addEventListener("click",()=>{
      const i=+b.dataset.i; marks[i]=marks[i]?0:1;
      b.setAttribute("aria-pressed", marks[i]?"true":"false");
      b.querySelector(".mk").textContent = marks[i]?"´":"˘";
      b.classList.remove("right","wrong");
    }));
    const solution = (withMarks) => {
      box.querySelectorAll(".syl").forEach((b,i)=>{
        const want = s.pat[i]==="1";
        if(withMarks){ b.classList.toggle("right", (marks[i]===1)===want); b.classList.toggle("wrong", (marks[i]===1)!==want); }
        else { marks[i]=want?1:0; b.setAttribute("aria-pressed", want?"true":"false"); b.querySelector(".mk").textContent = want?"´":"˘"; b.classList.add("right"); }
      });
    };
    box.querySelector("#scan-check").addEventListener("click",()=>{
      solution(true);
      const ok = marks.join("")===s.pat;
      const m = box.querySelector("#scan-meter").value;
      const mOk = m===s.meter;
      const fb = box.querySelector("#scan-fb");
      fb.innerHTML = `<div class="feedback ${ok&&mOk?"ok":"no"}">${ok?"Betonungen richtig.":"Noch nicht ganz: rot markierte Silben prüfen."} ${m? (mOk?"Metrum richtig.":"Metrum stimmt nicht."):"Wähle noch das Metrum."}</div>${ok&&mOk?`<p style="margin-top:8px">${esc(s.note)}</p>`:""}`;
    });
    box.querySelector("#scan-show").addEventListener("click",()=>{
      solution(false);
      box.querySelector("#scan-meter").value = s.meter;
      box.querySelector("#scan-fb").innerHTML = `<div class="feedback info"><span class="mono">${s.pat.split("").map(c=>c==="1"?"´":"˘").join(" ")}</span> · <b>${esc(s.meter)}</b><p style="margin-top:6px">${esc(s.note)}</p></div>`;
    });
    box.querySelector("#scan-prev").addEventListener("click",()=>{ state.scanIdx=(state.scanIdx-1+SCANSION.length)%SCANSION.length; draw(); });
    box.querySelector("#scan-next").addEventListener("click",()=>{ state.scanIdx=(state.scanIdx+1)%SCANSION.length; draw(); });
  };
  draw();
};

VIEWS.schemas = () => `

  <section class="section"><h2>Operatoren</h2>
    <div class="table-wrap"><table><thead><tr><th>AFB</th><th>Operator</th><th>Bedeutung</th><th>Was du tun musst</th></tr></thead><tbody>
      ${OPERATORS.map(o=>`<tr><td><span class="tag ${o.afb==="I"?"":o.afb==="II"?"green":"gold"}">${o.afb}</span></td><td class="en"><b>${o.op}</b></td><td>${o.de}</td><td>${o.tip}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="muted">AFB = Anforderungsbereich. I: Reproduktion (Verstehen), II: Reorganisation und Transfer (Analyse), III: Reflexion und Problemlösung (Bewertung, kreatives Schreiben).</p>
  </section>
  <section class="section"><h2>Aufbau nach Aufgabenart</h2>
    <div class="subtabs" id="schema-tabs">${Object.entries(SCHEMAS).map(([k,v])=>`<button class="chip" data-k="${k}" aria-pressed="${k===state.schema}">${v.name}</button>`).join("")}</div>
    <div class="panel" id="schema-body"></div>
  </section>
  <section class="section"><h2>Der perfekte Analyse-Absatz</h2>
    <p class="muted">Jeder Absatz im Hauptteil folgt dem Muster <b>Point – Evidence – Explanation – Link</b>. Beispiel zu <span class="en">Romeo and Juliet</span> 2.2:</p>
    <div class="legend"><span style="color:var(--accent)">Point</span><span style="color:var(--gold)">Evidence</span><span style="color:#5C7BC0">Explanation</span><span style="color:var(--bad)">Link</span></div>
    <div class="panel sample"><p><mark class="mP">At the beginning of the balcony scene, Romeo idealises Juliet as the centre of his world.</mark> <mark class="mE">He exclaims, “It is the east, and Juliet is the sun” (2.2.3).</mark> <mark class="mX">The metaphor places Juliet above all other people, since the sun is the source of light and life. Furthermore, the light imagery contrasts sharply with the darkness of the night, which suggests that their love shines in a hostile world. The regular iambic pentameter underlines the harmony of his feelings.</mark> <mark class="mL">This shows that Romeo's love is intense and immediate, which already hints at the haste that will later lead to the tragedy.</mark></p></div>
  </section>
  <section class="section"><h2>Formulierungshilfen</h2>
    <div class="grid g3">${PHRASES.map(p=>`<div class="panel stack"><h4>${p[0]}</h4><ul class="bul">${p[1].map(x=>`<li class="${x.startsWith("Verse")?"":"en"}">${esc(x)}</li>`).join("")}</ul></div>`).join("")}</div>
  </section>
  <section class="section"><h2>Richtig zitieren</h2>
    <div class="table-wrap"><table><thead><tr><th>Fall</th><th>Schreibweise</th></tr></thead><tbody>
      <tr><td>Eine Zeile im Auszug</td><td class="mono">(l. 12)</td></tr>
      <tr><td>Mehrere Zeilen</td><td class="mono">(ll. 12–15)</td></tr>
      <tr><td>Ganzes Stück: Akt, Szene, Zeile</td><td class="mono">(3.1.94) oder (III, 1, 94)</td></tr>
      <tr><td>Versumbruch im Zitat</td><td class="mono">“It is the east, / and Juliet is the sun”</td></tr>
      <tr><td>Auslassung</td><td class="mono">“Tomorrow, and tomorrow […] / Creeps in this petty pace”</td></tr>
      <tr><td>Paraphrase statt Zitat</td><td class="mono">(cf. l. 20)</td></tr>

VIEWS.karten = () => `
  <header class="page-head"><span class="eyebrow">Training</span><h1>Karteikarten</h1><p class="lead">Karte antippen zum Umdrehen. Markiere, was du schon kannst. Dein Stand wird in diesem Browser gespeichert.</p></header>
  <div class="row" id="fc-cats">${["Alle","Stilmittel","Drama","Film"].map(c=>`<button class="chip" data-c="${c}" aria-pressed="${c===state.fcCat}">${c}</button>`).join("")}</div>
  <div class="fc-wrap" id="fc"></div>`;
AFTER.karten = () => {
  const all = [
    ...DEVICES.map(d=>({k:"s:"+d.t, cat:"Stilmittel", front:d.t, back:`<b>${d.de}</b><p>${d.def}</p><p class="quote" style="font-size:1rem">${esc(d.ex)}</p><p class="muted" style="font-size:.9rem">${d.fn}</p>`})),
    ...DRAMA_TERMS.map(d=>({k:"d:"+d.t, cat:"Drama", front:d.t, back:`<b>${d.de}</b><p>${d.def}</p>${d.ex?`<p class="muted">${d.ex}</p>`:""}`})),
    ...FILM_TERMS.map(d=>({k:"f:"+d.t, cat:"Film", front:d.t, back:`<b>${d.de}</b><p>${d.def}</p><p class="muted">${d.fn}</p>`}))
  ];
  const box = document.getElementById("fc");
  const deck = () => { const d = all.filter(c=>state.fcCat==="Alle"||c.cat===state.fcCat); const open = d.filter(c=>!state.known.has(c.k)); return {d, open}; };
  const draw = () => {
    const {d, open} = deck();
    const known = d.length - open.length;
    if(!open.length){
      box.innerHTML = `<div class="panel stack"><h3>Alle ${d.length} Karten gewusst!</h3><p class="muted">Stark. Setze den Stapel zurück, um erneut zu üben.</p><div class="row"><button class="btn primary" id="fc-reset">Stapel zurücksetzen</button></div></div>`;
      box.querySelector("#fc-reset").addEventListener("click",()=>{ d.forEach(c=>state.known.delete(c.k)); store.set("known",[...state.known]); state.fcIdx=0; draw(); });
      return;
    }
    state.fcIdx = state.fcIdx % open.length;
    const c = open[state.fcIdx];
    box.innerHTML = `
      <div class="row" style="justify-content:space-between"><span class="muted">${known} von ${d.length} gewusst · noch ${open.length}</span><span class="tag">${c.cat}</span></div>
      <div class="meter"><i style="width:${Math.round(known/d.length*100)}%"></i></div>
      <div class="fc" id="fc-card" tabindex="0" role="button" aria-label="Karte umdrehen">
        <div class="fc-inner"><div class="fc-face"><span class="eyebrow">Begriff</span><span class="big">${c.front}</span><span class="fc-hint">Antippen zum Umdrehen</span></div>
        <div class="fc-face back">${c.back}</div></div></div>
      <div class="row"><button class="btn" id="fc-again">Nochmal</button><button class="btn primary" id="fc-know">Kann ich</button><button class="btn" id="fc-shuffle" style="margin-left:auto">Mischen</button></div>`;
    const card = box.querySelector("#fc-card");
    const flip = () => card.classList.toggle("flip");
    card.addEventListener("click", flip);
    card.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); flip(); } });
    box.querySelector("#fc-again").addEventListener("click",()=>{ state.fcIdx++; draw(); });
    box.querySelector("#fc-know").addEventListener("click",()=>{ state.known.add(c.k); store.set("known",[...state.known]); draw(); });
    box.querySelector("#fc-shuffle").addEventListener("click",()=>{ state.fcIdx=Math.floor(Math.random()*open.length); draw(); });
  };
  document.querySelectorAll("#fc-cats .chip").forEach(b=>b.addEventListener("click",()=>{
    state.fcCat=b.dataset.c; state.fcIdx=0; document.querySelectorAll("#fc-cats .chip").forEach(x=>x.setAttribute("aria-pressed", x===b)); draw();
  }));
  draw();
};

VIEWS.quiz = () => `
  <header class="page-head"><span class="eyebrow">Training</span><h1>Quiz</h1><p class="lead">Zehn zufällige Fragen aus ${QUIZ.length} zu Kontext, Struktur, Vers, Stilmitteln, Stücken und Film. Jede Antwort wird erklärt.</p></header>
  <div class="panel stack" id="quiz" style="max-width:720px"></div>`;
AFTER.quiz = () => {
  const box = document.getElementById("quiz");
  const start = () => { state.quiz = {qs: shuffle(QUIZ).slice(0,10).map(q=>{ const idx = shuffle(q.o.map((_,i)=>i)); return {...q, o: idx.map(i=>q.o[i]), a: idx.indexOf(q.a)}; }), i:0, res:[]}; draw(); };
  const draw = () => {
    const z = state.quiz;
    const prog = `<div class="q-prog">${z.qs.map((_,i)=>`<i class="${z.res[i]===true?"ok":z.res[i]===false?"no":i===z.i?"cur":""}"></i>`).join("")}</div>`;
    if(z.i>=z.qs.length){
      const score = z.res.filter(Boolean).length;
      if(state.best===null || score>state.best){ state.best=score; store.set("best",score); }
      const msg = score>=9?"Ausgezeichnet, du bist klausurbereit.":score>=7?"Gut! Schau dir die falschen Themen noch einmal an.":score>=5?"Solide Basis. Wiederhole die Kapitel, in denen du unsicher warst.":"Arbeite den Lernpfad noch einmal durch und versuch es erneut.";
      box.innerHTML = `${prog}<span class="eyebrow">Ergebnis</span><h2 style="font-variant-numeric:tabular-nums">${score} von 10</h2><p>${msg}</p><p class="muted">Bestes Ergebnis: ${state.best}/10</p><div class="row"><button class="btn primary" id="q-new">Neue Runde</button><a class="btn" href="#karten">Zu den Karteikarten</a></div>`;
      box.querySelector("#q-new").addEventListener("click", start);
      return;
    }
    const q = z.qs[z.i];
    box.innerHTML = `${prog}<span class="eyebrow">Frage ${z.i+1} von 10</span><h3>${esc(q.q)}</h3>
      <div class="q-opts">${q.o.map((o,i)=>`<button class="q-opt" data-i="${i}">${esc(o)}</button>`).join("")}</div><div id="q-fb"></div>`;
    box.querySelectorAll(".q-opt").forEach(b=>b.addEventListener("click",()=>{
      const i=+b.dataset.i, ok=i===q.a; z.res[z.i]=ok;
      box.querySelectorAll(".q-opt").forEach((x,j)=>{ x.disabled=true; if(j===q.a) x.classList.add("right"); else if(j===i) x.classList.add("wrong"); });
      box.querySelector("#q-fb").innerHTML = `<div class="feedback ${ok?"ok":"no"}" style="margin-top:4px"><b>${ok?"Richtig.":"Leider falsch."}</b> ${esc(q.e)}</div><div class="row" style="margin-top:10px"><button class="btn primary" id="q-next">${z.i===9?"Auswertung":"Weiter"}</button></div>`;
      box.querySelector("#q-next").addEventListener("click",()=>{ z.i++; draw(); });
      box.querySelector(".q-prog").outerHTML = `<div class="q-prog">${z.qs.map((_,k)=>`<i class="${z.res[k]===true?"ok":z.res[k]===false?"no":k===z.i?"cur":""}"></i>`).join("")}</div>`;
      box.querySelector("#q-next").focus();
    }));
  };
  if(!state.quiz || state.quiz.i>=10) start(); else draw();
};

VIEWS.klausur = () => `

      <div class="panel stack"><h4>Korrigieren (ca. 20 Min.)</h4><p>Typische Fehler: <i>s</i> bei 3. Person, <i>its/it's</i>, <i>their/there</i>, Zeitformen, Kommas bei <i>which</i>.</p></div>

      <tr><td>Figuren als reale Menschen behandeln</td><td>“Shakespeare presents Macbeth as …”</td></tr>
    </tbody></table></div>
  </section>
  <p class="foot">Zitate folgen gängigen modernen Ausgaben; Zeilenzählung kann je nach Edition abweichen. Prüfe Stellenangaben immer in eurer Schulausgabe.</p>`;
